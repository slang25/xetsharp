name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build --configuration Release
      - run: dotnet run --project tests/XetSharp.Tests --configuration Release --no-build
      # The S3 store runs against Floci in Docker, which only the Linux runner has.
      - run: dotnet run --project tests/XetSharp.Server.Tests --configuration Release --no-build
        env:
          XETSHARP_S3_TESTS: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      # Packing here so a broken package is a failed build rather than a discovery at release time.
      - run: dotnet pack --configuration Release --no-build

  # One Linux runner cross-compiles the server for every OS and architecture: AotAnywhere brings
  # its own linker and sysroots, so no other runner and no toolchain install is involved.
  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64, osx-x64, osx-arm64, win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet publish src/xet-server --configuration Release --runtime ${{ matrix.rid }} --output artifacts/${{ matrix.rid }}
      # The binary the runner itself can execute is also smoke-tested; the rest are checked by shape.
      - run: ./artifacts/${{ matrix.rid }}/xet-server --help
        if: matrix.rid == 'linux-x64'
      - run: file artifacts/${{ matrix.rid }}/xet-server*
      - name: Package
        run: |
          set -euo pipefail
          cd artifacts/${{ matrix.rid }}
          case "${{ matrix.rid }}" in
            win-*) zip -j ../xet-server-${{ matrix.rid }}.zip xet-server.exe ;;
            *)     tar -czf ../xet-server-${{ matrix.rid }}.tar.gz xet-server ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: xet-server-${{ matrix.rid }}
          path: |
            artifacts/xet-server-${{ matrix.rid }}.tar.gz
            artifacts/xet-server-${{ matrix.rid }}.zip
          if-no-files-found: error

  # A tag turns the published binaries into a GitHub release.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
